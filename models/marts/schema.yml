version: 2

models:
  - name: dim_customers
    description: "Customer dimension enriched with order activity and simple value segmentation."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: value_tier
        tests:
          - accepted_values:
              values: ['high_value', 'medium_value', 'low_value']

  - name: fct_orders
    description: "{{ doc('fct_orders') }}"
    columns:
      - name: order_id
        description: "Order identifier from stg_orders. Expected to be unique in this mart; duplicates indicate multiple payment rows per order or join-grain drift."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Customer identifier associated with the order."
        tests:
          - not_null
      - name: order_date
        description: "Date the order was placed."
      - name: order_status
        description: "Normalized order lifecycle status from stg_orders."
      - name: order_amount
        description: "Order amount after staging type-casting."
      - name: payment_method
        description: "Normalized payment method from stg_payments; null when no matching payment row exists."
      - name: payment_status
        description: "Normalized payment status from stg_payments; null when no matching payment row exists."
      - name: processed_at
        description: "Payment processing timestamp from stg_payments."
      - name: is_successful_order
        description: "Boolean flag set to true only when order_status = 'completed' and payment_status = 'paid'; otherwise false, including orders with no matching payment row."

  - name: rpt_customer_ltv
    description: "Simple reporting model to discuss CLV/LTV concepts in class."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: completed_revenue
        tests:
          - not_null

  - name: rpt_saas_mrr
    description: "SaaS reporting model summarizing MRR by region and subscription status."
    columns:
      - name: region
        tests:
          - not_null
      - name: status
        tests:
          - not_null
      - name: total_mrr_usd
        tests:
          - not_null
